<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Self-Driving AI</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: white;}
        canvas { background: #333; cursor: crosshair; margin-top: 20px; box-shadow: 0px 0px 20px rgba(0,0,0,0.8);}
        .controls { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; max-width: 300px;}
        button, input { padding: 10px; margin-bottom: 10px; cursor: pointer; width: 100%; font-weight: bold; box-sizing: border-box;}
        #status { font-size: 13px; color: #4ade80; line-height: 1.4;}
    </style>
</head>
<body>
    <div class="controls">
        <input type="file" id="trackUpload" accept="image/*">
        <div id="generationCounter" style="font-weight: bold; margin-bottom: 10px; color: #fbbf24; font-size: 16px; display: none;">Learning Cycles: 1</div>
        <button onclick="spawnNextGen()">Spawn Next Generation</button>
        <button onclick="resetLearning()" style="background: #ef4444; color: white; border: none;">Trash Brains & Reset</button>
        <div id="status">1. Upload a track image.<br>2. Click on the track to set the start point and begin.</div>
    </div>
    
    <canvas id="simulationCanvas"></canvas>

    <script src="network.js"></script>
    <script src="genetic.js"></script>
    <script src="script.js"></script>
</body>
</html>
